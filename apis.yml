name: Big Health
description: 'Big Health is a digital mental health company that develops evidence-based
  digital therapeutics for common mental health conditions. Its products include SleepioRx
  and DaylightRx, FDA-cleared prescription digital therapeutics for insomnia and generalized
  anxiety disorder, alongside the consumer apps Sleepio, Daylight, and Spark Direct.
  Big Health sells to health systems and providers, health plans, and employers rather
  than through a public developer program; it currently exposes no public API, developer
  portal, or SDK. Backed by Index Ventures and SoftBank Vision Fund.'
